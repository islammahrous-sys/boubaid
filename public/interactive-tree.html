                // Tree layout: Horizontal spread (dx) and vertical spread (dy)

                root.y0 = 0;

                        d._children = d.children;
                        d._children.forEach(collapse);
                        d.children = null;
                    }
                }

                    root.children[0].children[0].children[0].children.forEach(branch => {
                        if (branch.children) {
                            branch.children.forEach(collapse);
                        }
                    });
                }

                function update(source) {
                    const treeData = treemap(root);
                    const nodes = treeData.descendants();
                    const links = treeData.descendants().slice(1);
                    
                    // Root position right aligned for RTL
                    const rootXPosition = width - 200;

                    nodes.forEach(d => {
                        // RTL Math: Subtract Y depth from right margin
                        d.y_rtl = rootXPosition - d.y;
                    });

                    // --- NODES ---
                    const node = g.selectAll('g.node')
                        .data(nodes, d => d.id || (d.id = ++i));

                    const nodeEnter = node.enter().append('g')
                        .attr('class', 'node-group node')
                        .attr("transform", d => `translate(${source.y0_rtl || rootXPosition},${source.x0 || 0})`)
                        .on('click', click)
                        .on('mouseover', mouseover)
                        .on('mouseout', mouseout);

                    // Pill Shape
                    nodeEnter.append('rect')
                        .attr('class', 'node-bg')
                        .attr('width', 160)
                        .attr('height', 44)
                        .attr('x', -80) 
                        .attr('y', -22) 
                        .attr('rx', 22) 
                        .attr('fill', d => {
                            if (d.data.isRoot) return "#78462A"; 
                            if (d.data.isBranch) return "#FDE7D6"; 
                            return "#ffffff"; 
                        })
                        .attr('stroke', d => {
                            if (d.data.isRoot) return "#EDA746"; 
                            if (d.data.isBranch) return "#26583C"; 
                            return "#d1d5db"; 
                        })
                        .attr('stroke-width', d => d.data.isRoot ? 3 : (d._children ? 2 : 1));

                    // Text
                    nodeEnter.append('text')
                        .attr('dy', d => d.data.title ? -5 : 5) 
                        .attr('text-anchor', 'middle')
                        .text(d => d.data.name)
                        .style('fill', d => d.data.isRoot ? "#ffffff" : "#78462A")
                        .style('font-weight', d => d.data.isRoot || d.data.isBranch ? '800' : '600')
                        .style('font-size', d => d.data.isRoot ? '16px' : '14px')
                        .style('pointer-events', 'none');

                    // Subtitle
                    nodeEnter.filter(d => d.data.title).append('text')
                        .attr('dy', 14)
                        .attr('text-anchor', 'middle')
                        .text(d => d.data.title)
                        .style('fill', '#BE744A')
                        .style('font-weight', '700')
                        .style('font-size', '11px')
                        .style('pointer-events', 'none');

                    // Expand Indicator (Gold Dot on Left side)
                    const indicatorGroup = nodeEnter.append('g')
                        .attr('class', 'children-indicator')
                        .attr('transform', `translate(-70, 0)`) 
                        .style('opacity', d => d._children ? 1 : 0);
                        
                    indicatorGroup.append('circle')
                        .attr('r', 5)
                        .style('fill', '#EDA746')
                        .style('stroke', '#fff')
                        .style('stroke-width', '2px');

                    const nodeUpdate = nodeEnter.merge(node);
                    
                    nodeUpdate.transition()
                        .duration(duration)
                        .attr("transform", d => `translate(${d.y_rtl},${d.x})`);

                    nodeUpdate.select('.children-indicator')
                        .transition().duration(duration)
                        .style('opacity', d => d._children ? 1 : 0);

                    const nodeExit = node.exit().transition()
                        .duration(duration)
                        .attr("transform", d => `translate(${source.y_rtl},${source.x})`)
                        .remove();

                    nodeExit.select('rect').attr('width', 0).attr('height', 0);
                    nodeExit.select('text').style('fill-opacity', 0);

                    // --- LINKS ---
                    const link = g.selectAll('path.link')
                        .data(links, d => d.id);

                    const linkEnter = link.enter().insert('path', "g")
                        .attr("class", "link")
                        .attr('d', d => {
                            const o = {x: source.x0 || 0, y_rtl: source.y0_rtl || rootXPosition};
                            return diagonal(o, o);
                        });

                    const linkUpdate = linkEnter.merge(link);
                    linkUpdate.transition()
                        .duration(duration)
                        .attr('d', d => diagonal(d, d.parent));

                    link.exit().transition()
                        .duration(duration)
                        .attr('d', d => {
                            const o = {x: source.x, y_rtl: source.y_rtl};
                            return diagonal(o, o);
                        })
                        .remove();

                    nodes.forEach(d => {
                        d.x0 = d.x;
                        d.y0_rtl = d.y_rtl;
                    });
                }

                function diagonal(s, d) {
                    return `M ${s.y_rtl} ${s.x}
                            C ${(s.y_rtl + d.y_rtl) / 2} ${s.x},
                              ${(s.y_rtl + d.y_rtl) / 2} ${d.x},
                              ${d.y_rtl} ${d.x}`;
                }

                function mouseover(event, d) {
                    d3.selectAll('.link').classed('path-highlight', false);
                    let current = d;
                    while(current.parent) {
                        d3.selectAll('.link').filter(l => l.target === current).classed('path-highlight', true);
                        current = current.parent;
                    }
                }

                function mouseout(event, d) {
                    d3.selectAll('.link').classed('path-highlight', false);
                }

                function click(event, d) {
                    if (d.children) {
                        d._children = d.children; 
                        d.children = null;
                    } else {
                        d.children = d._children; 
                        d._children = null;
                    }
                    update(d);
                }

                function centerRoot() {
                    const scale = 0.7;
                    svg.transition().duration(750).call(
                        zoom.transform, 
                        d3.zoomIdentity.translate(0, height/2).scale(scale)
                    );
                }

                function centerNode(d) {
                    const scale = 1.3;
                    let x = -d.y_rtl * scale + (width / 2);
                    let y = -d.x * scale + (height / 2);
                    svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(x,y).scale(scale));
                }

                document.getElementById('zoom-in').addEventListener('click', () => {
                    svg.transition().duration(300).call(zoom.scaleBy, 1.3);
                });
                
                document.getElementById('zoom-out').addEventListener('click', () => {
                    svg.transition().duration(300).call(zoom.scaleBy, 0.7);
                });
                
                document.getElementById('reset').addEventListener('click', () => {
                    centerRoot();
                });
                
                document.getElementById('expand-all').addEventListener('click', () => {
                    root.descendants().forEach(d => {
                        if (d._children) { d.children = d._children; d._children = null; }
                    });
                    update(root);
                    centerRoot();
                });

                document.getElementById('collapse-all').addEventListener('click', () => {
                    if (root.children) {
                        root.children[0].children[0].children[0].children.forEach(branch => {
                            if (branch.children) {
                                branch.children.forEach(collapse);
                            }
                        });
                    }
                    update(root);
                    centerRoot();
                });

                document.getElementById('search-box').addEventListener('input', function(e) {
                    const term = e.target.value.trim().toLowerCase();
                    g.selectAll('.node-group').classed('node--highlighted', false);
                    
                    if(term.length < 2) return;
                    
                    const matches = root.descendants().filter(d => d.data.name.toLowerCase().includes(term));
                    
                    if(matches.length > 0) {
                        matches.forEach(match => {
                            let current = match;
                            while(current.parent) {
                                if(current.parent._children) {
                                    current.parent.children = current.parent._children;
                                    current.parent._children = null;
                                }
                                current = current.parent;
                            }
                        });
                        
                        update(root);
                        
                        setTimeout(() => {
                            matches.forEach(match => {
                                g.selectAll('.node-group').filter(d => d.data.name === match.data.name).classed('node--highlighted', true);
                            });
                            centerNode(matches[0]);
                        }, duration + 100);
                    }
                });

                // Initialize
                update(root);
                centerRoot();

            } catch (error) {
                console.error("D3 Error:", error);
                document.getElementById('tree-container').innerHTML = `<div class="error-msg">حدث خطأ داخلي في رسم الجدارية: <br>${error.message}</div>`;
            }
        }); 
    </script>
</body>
</html>
