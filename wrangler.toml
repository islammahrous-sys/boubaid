# ============================================================================
# DEPLOY TARGET 1 of 2 — Cloudflare Workers
# ----------------------------------------------------------------------------
# This repo currently has TWO possible deploy targets configured (this file and
# vercel.json) because it wasn't clear which one is actually live: vite.config.ts
# builds via @lovable.dev/vite-tanstack-config, whose nitro preset defaults to
# "cloudflare-module" (see LOVABLE_NITRO_PRESETS in that package), a .wrangler/
# cache directory exists locally, AND docs/temporary-vercel-auth-setup.md
# documents a live Vercel deployment at alboabid-heritage-hub.vercel.app.
#
# Confirm which platform you actually deploy to, then delete the other file
# (this one, or vercel.json) so there's no ambiguity going forward.
#
# This config matches what `npm run build` already produces locally for the
# default "cloudflare-module" preset — a Cloudflare Workers deployment (static
# assets served via the ASSETS binding alongside a Worker for SSR), NOT
# Cloudflare Pages. See .output/nitro.json and .output/server/wrangler.json
# (generated by nitro after a build) for the values this was based on.
# ============================================================================

name = "alboabid-heritage-hub" # placeholder — rename to your actual Worker name
main = ".output/server/index.mjs"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"
binding = "ASSETS"

# Deploy with:
#   npm run build
#   npx wrangler deploy
#
# No account_id is set here — wrangler will use the account you're logged into
# (`npx wrangler login`), or prompt you to pick one if your account has several.
